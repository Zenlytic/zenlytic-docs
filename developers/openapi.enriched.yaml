openapi: 3.1.0
info:
  title: FastAPI
  contact:
    email: support@zenlytic.com
  version: 2.0.0
  description: |
    ## Servers & Authentication

    ### Servers

    Zenlytic runs separate API hosts per region. Use the host matching where your organization is hosted.

    {% tabs %}
    {% tab title="US" %}
    **Base URL**
    `https://api-external.zenlytic.com/api/v2`
    {% endtab %}

    {% tab title="EU" %}
    **Base URL**
    `https://euapi-external.zenlytic.com/api/v2`
    {% endtab %}
    {% endtabs %}

    ### Authentication

    Include your personal access token as a bearer token in the `Authorization` header:

    ```
    Authorization: Bearer YOUR_TOKEN
    ```

    {% hint style="info" %}
    A token's scope — a single workspace (**Admin**) or your entire organization (**Org admin**) — is fixed when the token is created, based on your role in the workspace you created it from. It isn't visible from the token itself, so call `GET /me` to see what a given token can actually reach before building against it. See [Overview](README.md#discovering-your-tokens-scope) for the full scope table.
    {% endhint %}

    ## Getting Started

    {% stepper %}
    {% step %}
    ## Create a Personal Access Token
    See [Overview](README.md#creating-a-personal-access-token) for how to create one from your user menu.
    {% endstep %}

    {% step %}
    ## Check Your Token's Scope
    Call `GET /me` with your new token. It returns your organization and the workspaces the token can see — one workspace for an admin-scoped token, or every workspace in the organization for an org admin token.
    {% endstep %}

    {% step %}
    ## Make Your First Request
    Org admin token: call `GET /workspaces` to list every workspace in your organization. Admin token: call `GET /workspaces/{workspace_id}/groups` for a workspace your token can see.
    {% endstep %}
    {% endstepper %}

    ## Response Envelope

    Every response, success or error, is wrapped in the same `meta` envelope:

    ```json
    {
      "data": { ... },
      "meta": {
        "status": "success",
        "errors": [],
        "warnings": []
      }
    }
    ```

    `meta.warnings` can carry non-fatal notices alongside a successful response — for example, two groups in a workspace sharing the same `user_attribute_precedence`.

    ## Error Responses

    Errors set `meta.status` to `"error"` and populate `meta.errors` with one entry per problem:

    ```json
    {
      "meta": {
        "status": "error",
        "errors": [
          {
            "message": "Workspace not found",
            "status_code": 404,
            "error_code": "not_found",
            "occurred_at": "2026-08-05T12:00:00Z"
          }
        ],
        "warnings": []
      }
    }
    ```

    {% hint style="warning" %}
    `occurred_at`, `error_code`, and `error_metadata` are optional and may be `null` — key off `status_code` and `message` first.
    {% endhint %}

    | Code | Meaning | When it happens |
    | --- | --- | --- |
    | `400` | Bad Request | An application-level validation rule failed — not a schema/type error, but a business rule (e.g. a value out of range, an inferred setting with no valid value). |
    | `401` | Invalid token | The bearer token fails gateway-level verification — wrong issuer/key-id, wrong signing algorithm, bad signature, failed claims, or an empty subject. |
    | `403` | Forbidden | Any authentication or authorization failure — missing/invalid credential, a PAT used against a workspace outside its scope, insufficient permission, or a `workspace_id`/`group_id`/etc. that doesn't exist or isn't visible to this token. These deliberately share one generic message — the API does not reveal which case applies. |
    | `404` | Not Found | A specific named resource wasn't found within a scope you can otherwise access — distinct from the 403 case above, which covers the *scope itself* (e.g. the `workspace_id`) being inaccessible. Also returned for a request path that doesn't match any route. |
    | `405` | Method Not Allowed | Valid path, wrong HTTP verb (e.g. `PUT` on a route that only defines `GET`/`POST`). |
    | `409` | Conflict | Trying to create something that already exists in a way that would collide — a duplicate attribute-definition name in a workspace, an attribute already set on this group/member, or an existing group membership. |
    | `422` | Unprocessable Entity | The request itself doesn't match the expected shape — malformed JSON, a required field missing, or a field of the wrong type — caught by schema validation before any application logic runs. |
    | `429` | Too Many Requests | Rate limit exceeded. |
    | `500` | Internal Server Error | An unexpected, unhandled error. The message is always the same generic string — no internal detail is ever leaked to the client. |

    ## Rate Limiting

    The API enforces rate limits, keyed by your personal access token. Limits vary by endpoint, so don't assume a single number applies everywhere — check your current quota from the response headers instead of a fixed value from documentation:

    - `X-RateLimit-Limit` — your quota for the current window
    - `X-RateLimit-Remaining` — requests left in the current window
    - `X-RateLimit-Reset` — seconds until the window resets

    When a request is rejected, the API returns `429` with the standard error envelope:

    ```json
    {
      "meta": {
        "status": "error",
        "errors": [
          {
            "message": "Rate limit exceeded",
            "status_code": 429
          }
        ],
        "warnings": []
      }
    }
    ```

    {% hint style="info" %}
    On a `429`, back off exponentially and use `X-RateLimit-Reset` to know when it's safe to retry, rather than a fixed retry delay.
    {% endhint %}
servers:
- url: https://api-external.zenlytic.com/api/v2
  description: US
- url: https://euapi-external.zenlytic.com/api/v2
  description: EU
paths:
  /me:
    get:
      tags:
      - Me
      summary: Get Me
      description: |-
        Retrieve your own user ID, organization, and the workspaces you can see.

        {% hint style="info" %}
        Call this first when building against a new token. It tells you whether the token is scoped to a single workspace (**Admin**) or your whole organization (**Org admin**), which decides which endpoints below it can call.
        {% endhint %}
      operationId: get_me_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_MeSchema_'
              example:
                data:
                  user_id: usr_111
                  organization:
                    id: org_123
                    name: Acme Corp
                  workspaces:
                  - id: ws_456
                    name: acme-prod
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
        5XX:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
      security:
      - HTTPBearer: []
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/me \
            -H 'Authorization: Bearer YOUR_TOKEN'
      - lang: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/me',
              headers={'Authorization': 'Bearer YOUR_TOKEN'}
          )
          print(r.json())
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/me', {
            headers: { 'Authorization': 'Bearer YOUR_TOKEN' },
          });
          const data = await response.json();
  /workspaces:
    get:
      tags:
      - Workspaces
      summary: List Workspaces
      description: |-
        List the workspaces in your organization.

        Archived workspaces are excluded unless ``include_archived`` is true.
      operationId: list_workspaces_for_organization_workspaces_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          description: Include archived workspaces in the results.
          default: false
          title: Include Archived
        description: Include archived workspaces in the results.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2CollectionResponse_WorkspaceSchema_'
              example:
                data:
                - id: ws_456
                  name: acme-prod
                  provision_by_default: true
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/workspaces \
            -H 'Authorization: Bearer YOUR_TOKEN'
      - lang: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/workspaces',
              headers={'Authorization': 'Bearer YOUR_TOKEN'}
          )
          print(r.json())
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/workspaces', {
            headers: { 'Authorization': 'Bearer YOUR_TOKEN' },
          });
          const data = await response.json();
    post:
      tags:
      - Workspaces
      summary: Create Workspace
      description: |-
        Create a new workspace in your organization.

        Not a blank slate: the caller and every existing organization admin are auto-added as
        organization admins, so they'll immediately appear in the workspace's "All Users" group,
        whose membership always tracks the roster. Other org members aren't added until
        separately granted access.
      operationId: create_workspace_in_organization_workspaces_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceSchema'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_CreateWorkspaceResponseSchema_'
              example:
                data:
                  id: ws_789
                  name: acme-staging
                  provision_by_default: false
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L -X POST https://api-external.zenlytic.com/api/v2/workspaces \
            -H 'Authorization: Bearer YOUR_TOKEN' \
            -H 'Content-Type: application/json' \
            -d '{"name": "acme-staging", "provision_by_default": false}'
      - lang: Python
        source: |
          import requests
          r = requests.post(
              'https://api-external.zenlytic.com/api/v2/workspaces',
              headers={'Authorization': 'Bearer YOUR_TOKEN'},
              json={'name': 'acme-staging', 'provision_by_default': False}
          )
          print(r.json())
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/workspaces', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer YOUR_TOKEN', 'Content-Type': 'application/json' },
            body: JSON.stringify({"name": "acme-staging", "provision_by_default": false}),
          });
          const data = await response.json();
  /workspaces/{workspace_id}:
    delete:
      tags:
      - Workspaces
      summary: Archive Workspace
      description: |-
        Archive a workspace in your organization.

        Any user whose current workspace is the one being archived is silently reassigned to
        another workspace they belong to (or none, if they have no other workspace).

        {% hint style="danger" %}
        There is no confirmation step. Double-check `workspace_id` before calling — this is a soft delete, but the workspace's users are reassigned to another workspace in the organization immediately.
        {% endhint %}
      operationId: archive_workspace_for_organization_workspaces__workspace_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '204':
          description: Successful Response
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L -X DELETE https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id> \
            -H 'Authorization: Bearer YOUR_TOKEN'
      - lang: Python
        source: |
          import requests
          requests.delete(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>',
              headers={'Authorization': 'Bearer YOUR_TOKEN'}
          )
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>', {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer YOUR_TOKEN' },
          });
  /workspaces/{workspace_id}/groups:
    get:
      tags:
      - Groups
      summary: List Groups
      description: |-
        List every group in the workspace, including the built-in "All Users" group.

        Each group carries its member ids and its ``user_attribute_precedence``. A warning is
        returned when two groups in the workspace share a precedence value, since the winning
        user attribute is then undefined.
      operationId: get_groups_workspaces__workspace_id__groups_get
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2CollectionResponse_GroupResponseSchema_'
              example:
                data:
                - id: grp_123
                  workspace_id: ws_456
                  name: Sales
                  is_all_users: false
                  user_attribute_precedence: 1
                  users:
                  - usr_111
                  - usr_222
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups \
            -H 'Authorization: Bearer YOUR_TOKEN'
      - lang: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups',
              headers={'Authorization': 'Bearer YOUR_TOKEN'}
          )
          print(r.json())
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups', {
            headers: { 'Authorization': 'Bearer YOUR_TOKEN' },
          });
          const data = await response.json();
    post:
      tags:
      - Groups
      summary: Create Group
      description: |-
        Create a group in the workspace.

        ``user_attribute_precedence`` must be greater than 0 and decides which group's value wins
        when a member belongs to several groups that set the same user attribute. A warning is
        returned when the new group duplicates an existing precedence value.
      operationId: create_group_workspaces__workspace_id__groups_post
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupSchema'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_GroupResponseSchema_'
              example:
                data:
                  id: grp_123
                  workspace_id: ws_456
                  name: Sales
                  is_all_users: false
                  user_attribute_precedence: 1
                  users:
                  - usr_111
                  - usr_222
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L -X POST https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups \
            -H 'Authorization: Bearer YOUR_TOKEN' \
            -H 'Content-Type: application/json' \
            -d '{"name": "Sales", "user_attribute_precedence": 1}'
      - lang: Python
        source: |
          import requests
          r = requests.post(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups',
              headers={'Authorization': 'Bearer YOUR_TOKEN'},
              json={'name': 'Sales', 'user_attribute_precedence': 1}
          )
          print(r.json())
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer YOUR_TOKEN', 'Content-Type': 'application/json' },
            body: JSON.stringify({"name": "Sales", "user_attribute_precedence": 1}),
          });
          const data = await response.json();
  /workspaces/{workspace_id}/groups/{group_id}:
    get:
      tags:
      - Groups
      summary: Get Group
      description: |-
        Retrieve a single group in the workspace by id.

        Returns 404 if no group with that id exists in the workspace.
      operationId: get_group_workspaces__workspace_id__groups__group_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_GroupResponseSchema_'
              example:
                data:
                  id: grp_123
                  workspace_id: ws_456
                  name: Sales
                  is_all_users: false
                  user_attribute_precedence: 1
                  users:
                  - usr_111
                  - usr_222
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id> \
            -H 'Authorization: Bearer YOUR_TOKEN'
      - lang: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>',
              headers={'Authorization': 'Bearer YOUR_TOKEN'}
          )
          print(r.json())
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>', {
            headers: { 'Authorization': 'Bearer YOUR_TOKEN' },
          });
          const data = await response.json();
    patch:
      tags:
      - Groups
      summary: Update Group
      description: |-
        Update a group's name or user attribute precedence.

        Returns 400 if the group is the built-in "All Users" group, whose membership always
        tracks the workspace roster and can't be renamed or reweighted.

        A warning is returned if the update makes this group's precedence match another
        group's in the workspace.
      operationId: update_group_workspaces__workspace_id__groups__group_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupSchema'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_GroupResponseSchema_'
              example:
                data:
                  id: grp_123
                  workspace_id: ws_456
                  name: Sales Team
                  is_all_users: false
                  user_attribute_precedence: 2
                  users:
                  - usr_111
                  - usr_222
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L -X PATCH https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id> \
            -H 'Authorization: Bearer YOUR_TOKEN' \
            -H 'Content-Type: application/json' \
            -d '{"name": "Sales Team", "user_attribute_precedence": 2}'
      - lang: Python
        source: |
          import requests
          r = requests.patch(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>',
              headers={'Authorization': 'Bearer YOUR_TOKEN'},
              json={'name': 'Sales Team', 'user_attribute_precedence': 2}
          )
          print(r.json())
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>', {
            method: 'PATCH',
            headers: { 'Authorization': 'Bearer YOUR_TOKEN', 'Content-Type': 'application/json' },
            body: JSON.stringify({"name": "Sales Team", "user_attribute_precedence": 2}),
          });
          const data = await response.json();
    delete:
      tags:
      - Groups
      summary: Delete Group
      description: |-
        Delete a group and the user attributes attached to it.

        Members are not deleted, only their membership.

        Returns 400 if the group is the built-in "All Users" group, whose membership always
        tracks the workspace roster and can't be deleted.
      operationId: delete_group_workspaces__workspace_id__groups__group_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      responses:
        '204':
          description: Successful Response
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L -X DELETE https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id> \
            -H 'Authorization: Bearer YOUR_TOKEN'
      - lang: Python
        source: |
          import requests
          requests.delete(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>',
              headers={'Authorization': 'Bearer YOUR_TOKEN'}
          )
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>', {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer YOUR_TOKEN' },
          });
  /workspaces/{workspace_id}/groups/{group_id}/members:
    get:
      tags:
      - Group Members
      summary: List Group Members
      description: |-
        List every member of the group.

        For the built-in "All Users" group, this returns every member of the workspace, since
        its membership always tracks the workspace roster.
      operationId: get_group_members_workspaces__workspace_id__groups__group_id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
