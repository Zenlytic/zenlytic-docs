      description: |-
        List the user attribute values that apply to a workspace member.

        Includes values inherited from the member's groups as well as values set directly on the
        member. ``is_overridden`` marks a group-inherited value that a higher-precedence group's
        value, or a value set directly on the member, has superseded - so the effective set is
        the entries where it is false. ``user_attribute_precedence`` is ``null`` exactly when
        ``source`` is ``"user"`` (a directly-set value) - only groups carry a precedence.
      operationId: get_member_user_attributes_workspaces__workspace_id__members__member_id__user_attributes_get
