openapi: 3.1.0
info:
  title: FastAPI
  version: 2.0.0
  description: |
    # Welcome to the Zenlytic API

    Use the Zenlytic API to manage workspaces, groups, and user attributes programmatically. The API is organized into two endpoint groups:

    * **Org admin endpoints** (`GET /workspaces`, `POST /workspaces`, `DELETE /workspaces/{workspace_id}`) — list, create, and archive workspaces in your organization. The organization is always the calling token's own organization; none of these endpoints take an organization ID. Org admins also have admin permissions in every workspace, so an org admin token can call the admin endpoints below to manage groups and user attributes across any workspace.
    * **Admin endpoints** (`/workspaces/{workspace_id}/...`) — manage a single workspace, including groups, user attribute definitions, and user attribute assignments for groups and members.

    Every request is authenticated with a [personal access token](README.md#authentication).

    ## Servers & Authentication

    ### Servers

    Zenlytic runs separate API hosts per region. Use the host matching where your organization is hosted.

    {% tabs %}
    {% tab title="US" %}
    **Base URL**
    `https://api-external.zenlytic.com/api/v2`
    {% endtab %}

    {% tab title="EU" %}
    **Base URL**
    `https://euapi-external.zenlytic.com/api/v2`
    {% endtab %}
    {% endtabs %}

    ### Authentication

    Include your personal access token as a bearer token in the `Authorization` header:

    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    {% hint style="info" %}
    A token's scope — a single workspace (**Admin**) or your entire organization (**Org admin**) — is fixed when the token is created, based on your role in the workspace you created it from. It isn't visible from the token itself, so call `GET /me` to see what a given token can actually reach before building against it. See [Overview](README.md#discovering-your-tokens-scope) for the full scope table.
    {% endhint %}

    ## Getting started

    {% stepper %}
    {% step %}
    ## Create a personal access token
    See [Overview](README.md#creating-a-personal-access-token) for how to create one from your user menu.
    {% endstep %}

    {% step %}
    ## Check your token's scope
    Call `GET /me` with your new token. It returns your organization and the workspaces the token can see — one workspace for an admin-scoped token, or every workspace in the organization for an org admin token.
    {% endstep %}

    {% step %}
    ## Make your first request
    Org admin token: call `GET /workspaces` to list every workspace in your organization. Admin token: call `GET /workspaces/{workspace_id}/groups` for a workspace your token can see.
    {% endstep %}
    {% endstepper %}

    ## Response envelope

    Every response, success or error, is wrapped in the same `meta` envelope:

    ```json
    {
      "data": { ... },
      "meta": {
        "status": "success",
        "errors": [],
        "warnings": []
      }
    }
    ```

    `meta.warnings` can carry non-fatal notices alongside a successful response — for example, two groups in a workspace sharing the same `user_attribute_precedence`.

    ## Error responses

    Errors set `meta.status` to `"error"` and populate `meta.errors` with one entry per problem:

    ```json
    {
      "meta": {
        "status": "error",
        "errors": [
          {
            "message": "Workspace not found",
            "status_code": 404,
            "error_code": "not_found",
            "occurred_at": "2026-08-05T12:00:00Z"
          }
        ],
        "warnings": []
      }
    }
    ```

    {% hint style="warning" %}
    `error_code` and `error_metadata` are optional and may be `null` — key off `status_code` and `message` first.
    {% endhint %}
servers:
- url: https://api-external.zenlytic.com/api/v2
  description: US
- url: https://euapi-external.zenlytic.com/api/v2
  description: EU
paths:
  /me:
    get:
      tags:
      - Me
      summary: Get Me
      description: |-
        Retrieve your organization and the workspaces you can see.

        {% hint style="info" %}
        Call this first when building against a new token. It tells you whether the token is scoped to a single workspace (**Admin**) or your whole organization (**Org admin**), which decides which endpoints below it can call.
        {% endhint %}
      operationId: get_me_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_MeSchema_'
              example:
                data:
                  organization:
                    id: org_123
                    name: Acme Corp
                  workspaces:
                  - id: ws_456
                    name: acme-prod
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
        5XX:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
      security:
      - HTTPBearer: []
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/me \
            -H 'Authorization: Bearer YOUR_API_KEY'
      - lang: Python
        label: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/me',
              headers={'Authorization': 'Bearer YOUR_API_KEY'}
          )
          print(r.json())
  /workspaces:
    get:
      tags:
      - Workspaces
      summary: List Workspaces For Organization
      description: |-
        List the workspaces in your organization.

        Archived workspaces are excluded unless ``include_archived`` is true.
      operationId: list_workspaces_for_organization_workspaces_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          description: Include archived workspaces in the results.
          default: false
          title: Include Archived
        description: Include archived workspaces in the results.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2CollectionResponse_WorkspaceManagerWorkspaceSchema_'
              example:
                data:
                - id: ws_456
                  name: acme-prod
                  provision_by_default: true
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/workspaces \
            -H 'Authorization: Bearer YOUR_API_KEY'
      - lang: Python
        label: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/workspaces',
              headers={'Authorization': 'Bearer YOUR_API_KEY'}
          )
          print(r.json())
    post:
      tags:
      - Workspaces
      summary: Create Workspace In Organization
      description: |-
        Create a new workspace in your organization.

        Requires workspace_management permission on every workspace you belong to in the
        organization.
      operationId: create_workspace_in_organization_workspaces_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceSchema'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_CreateWorkspaceResponseSchema_'
              example:
                data:
                  id: ws_789
                  name: acme-staging
                  provision_by_default: false
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L -X POST https://api-external.zenlytic.com/api/v2/workspaces \
            -H 'Authorization: Bearer YOUR_API_KEY' \
            -H 'Content-Type: application/json' \
            -d '{"name": "acme-staging", "provision_by_default": false}'
      - lang: Python
        label: Python
        source: |
          import requests
          r = requests.post(
              'https://api-external.zenlytic.com/api/v2/workspaces',
              headers={'Authorization': 'Bearer YOUR_API_KEY'},
              json={'name': 'acme-staging', 'provision_by_default': False}
          )
          print(r.json())
  /workspaces/{workspace_id}:
    delete:
      tags:
      - Workspaces
      summary: Archive Workspace For Organization
      description: |-
        Archive a workspace in your organization.

        {% hint style="danger" %}
        There is no confirmation step. Double-check `workspace_id` before calling — this is a soft delete, but the workspace's users are reassigned to another workspace in the organization immediately.
        {% endhint %}
      operationId: archive_workspace_for_organization_workspaces__workspace_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '204':
          description: Successful Response
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L -X DELETE https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id> \
            -H 'Authorization: Bearer YOUR_API_KEY'
      - lang: Python
        label: Python
        source: |
          import requests
          requests.delete(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>',
              headers={'Authorization': 'Bearer YOUR_API_KEY'}
          )
  /workspaces/{workspace_id}/groups/{group_id}/user_attributes:
    get:
      tags:
      - Groups
      summary: Get Group User Attributes
      description: |-
        List the user attribute values set on a group.

        These apply to every member of the group. When a member is in several groups that set the
        same attribute, the group with the highest ``user_attribute_precedence`` wins.

        ``source`` is always ``"group"`` and ``source_id`` always matches this group's ID here —
        both only vary on the member user attributes endpoint, where a value can come from any of a
        member's groups or be set directly on the member.
      operationId: get_group_user_attributes_workspaces__workspace_id__groups__group_id__user_attributes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2CollectionResponse_UserAttributeSchema_'
              example:
                data:
                - id: ua_789
                  user_attribute_definition_id: uad_123
                  value: west
                  data_type: string
                  name: region
                  source: group
                  source_id: grp_123
                  user_attribute_precedence: 1
                  is_overridden: false
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>/user_attributes \
            -H 'Authorization: Bearer YOUR_API_KEY'
      - lang: Python
        label: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>/user_attributes',
              headers={'Authorization': 'Bearer YOUR_API_KEY'}
          )
          print(r.json())
    post:
      tags:
      - Groups
      summary: Create Group User Attribute
      description: |-
        Set a user attribute value on a group.

        ``user_attribute_definition_id`` must reference an existing definition in the workspace. A
        group can only set each definition once; a second value for the same definition returns
        409 — patch the existing value instead.

        ``value`` must match the definition's ``data_type``: ``YYYY-MM-DD`` for ``date``, a numeric
        string for ``number``.
      operationId: create_group_user_attribute_workspaces__workspace_id__groups__group_id__user_attributes_post
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserAttributeSchema'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_UserAttributeSchema_'
              example:
                data:
                  id: ua_789
                  user_attribute_definition_id: uad_123
                  value: west
                  data_type: string
                  name: region
                  source: group
                  source_id: grp_123
                  user_attribute_precedence: 1
                  is_overridden: false
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L -X POST https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>/user_attributes \
            -H 'Authorization: Bearer YOUR_API_KEY' \
            -H 'Content-Type: application/json' \
            -d '{"user_attribute_definition_id": "uad_123", "value": "west"}'
      - lang: Python
        label: Python
        source: |
          import requests
          r = requests.post(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>/user_attributes',
              headers={'Authorization': 'Bearer YOUR_API_KEY'},
              json={'user_attribute_definition_id': 'uad_123', 'value': 'west'}
          )
          print(r.json())
  /workspaces/{workspace_id}/groups/{group_id}/user_attributes/{user_attribute_id}:
    delete:
      tags:
      - Groups
      summary: Delete Group User Attribute
      description: |-
        Remove a user attribute value from a group.

        The definition itself is untouched — only this group's value for it is deleted.
      operationId: delete_group_user_attribute_workspaces__workspace_id__groups__group_id__user_attributes__user_attribute_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      - name: user_attribute_id
        in: path
        required: true
        schema:
          type: string
          title: User Attribute Id
      responses:
        '204':
          description: Successful Response
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L -X DELETE https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>/user_attributes/<user_attribute_id> \
            -H 'Authorization: Bearer YOUR_API_KEY'
      - lang: Python
        label: Python
        source: |
          import requests
          requests.delete(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>/user_attributes/<user_attribute_id>',
              headers={'Authorization': 'Bearer YOUR_API_KEY'}
          )
    patch:
      tags:
      - Groups
      summary: Update Group User Attribute
      description: |-
        Update the value of a user attribute already set on a group.

        Only ``value`` is mutable; to point at a different definition, delete this value and
        create a new one. ``value`` must match the existing definition's ``data_type``:
        ``YYYY-MM-DD`` for ``date``, a numeric string for ``number``.
      operationId: update_group_user_attribute_workspaces__workspace_id__groups__group_id__user_attributes__user_attribute_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      - name: user_attribute_id
        in: path
        required: true
        schema:
          type: string
          title: User Attribute Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserAttributeSchema'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_UserAttributeSchema_'
              example:
                data:
                  id: ua_789
                  user_attribute_definition_id: uad_123
                  value: east
                  data_type: string
                  name: region
                  source: group
                  source_id: grp_123
                  user_attribute_precedence: 1
                  is_overridden: false
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L -X PATCH https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>/user_attributes/<user_attribute_id> \
            -H 'Authorization: Bearer YOUR_API_KEY' \
            -H 'Content-Type: application/json' \
            -d '{"value": "east"}'
      - lang: Python
        label: Python
        source: |
          import requests
          r = requests.patch(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups/<group_id>/user_attributes/<user_attribute_id>',
              headers={'Authorization': 'Bearer YOUR_API_KEY'},
              json={'value': 'east'}
          )
          print(r.json())
  /workspaces/{workspace_id}/groups:
    get:
      tags:
      - Groups
      summary: Get Groups
      description: |-
        List every group in the workspace, including the built-in "All Users" group.

        Each group carries its member ids and its ``user_attribute_precedence``. A warning is
        returned when two groups in the workspace share a precedence value, since the winning
        user attribute is then undefined.
      operationId: get_groups_workspaces__workspace_id__groups_get
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2CollectionResponse_GroupResponseSchema_'
              example:
                data:
                - id: grp_123
                  workspace_id: ws_456
                  name: Sales
                  is_all_users: false
                  user_attribute_precedence: 1
                  users:
                  - usr_111
                  - usr_222
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups \
            -H 'Authorization: Bearer YOUR_API_KEY'
      - lang: Python
        label: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups',
              headers={'Authorization': 'Bearer YOUR_API_KEY'}
          )
          print(r.json())
    post:
      tags:
      - Groups
      summary: Create Group
      description: |-
        Create a group in the workspace.

        ``user_attribute_precedence`` must be greater than 0 and decides which group's value wins
        when a member belongs to several groups that set the same user attribute. A warning is
        returned when the new group duplicates an existing precedence value.
      operationId: create_group_workspaces__workspace_id__groups_post
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupSchema'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_GroupResponseSchema_'
              example:
                data:
                  id: grp_123
                  workspace_id: ws_456
                  name: Sales
                  is_all_users: false
                  user_attribute_precedence: 1
                  users:
                  - usr_111
                  - usr_222
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L -X POST https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups \
            -H 'Authorization: Bearer YOUR_API_KEY' \
            -H 'Content-Type: application/json' \
            -d '{"name": "Sales", "user_attribute_precedence": 1}'
      - lang: Python
        label: Python
        source: |
          import requests
          r = requests.post(
              'https://api-external.zenlytic.com/api/v2/workspaces/<workspace_id>/groups',
              headers={'Authorization': 'Bearer YOUR_API_KEY'},
              json={'name': 'Sales', 'user_attribute_precedence': 1}
          )
          print(r.json())
  /workspaces/{workspace_id}/groups/{group_id}:
    get:
      tags:
      - Groups
      summary: Get Group
      description: |-
        Retrieve a single group in the workspace by id.

        Returns 404 if no group with that id exists in the workspace.
      operationId: get_group_workspaces__workspace_id__groups__group_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_GroupResponseSchema_'
              example:
                data:
                  id: grp_123
                  workspace_id: ws_456
                  name: Sales
                  is_all_users: false
                  user_attribute_precedence: 1
                  users:
                  - usr_111
                  - usr_222
                meta:
                  status: success
                  errors: []
                  warnings: []
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
