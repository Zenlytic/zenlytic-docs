  /organizations/{organization_id}/auth-providers/{auth_provider_id}/identities/{user_id}:
    get:
      tags:
      - IdP Mappings
      summary: Get User Identity At Provider
      description: |-
        The user's external id at the provider and the attributes from their last sign-in through it,
        so mapping screens can offer real attribute and group names.

        Organization admins only. A personal access token must belong to an organization admin, be
        minted for this organization (``{organization_id}`` must match the token's organization) and
        be scoped to all workspaces; otherwise 403. ``{auth_provider_id}`` is an ``id`` from
        ``GET /organizations/{organization_id}/auth-providers``; returns 404 when it is not a
        provider of this organization.

        Returns 404 when the user has no identity at this provider. Only SAML sign-ins store their
        attributes; OIDC sign-ins don't, so an OIDC provider returns 404.
      operationId: get_provider_identity_organizations__organization_id__auth_providers__auth_provider_id__identities__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      - name: auth_provider_id
        in: path
        required: true
        schema:
          type: string
          title: Auth Provider Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2Response_ProviderIdentitySchema_'
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/organizations/<organization_id>/auth-providers/<auth_provider_id>/identities/<user_id> \
            -H 'Authorization: Bearer YOUR_TOKEN'
      - lang: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/organizations/<organization_id>/auth-providers/<auth_provider_id>/identities/<user_id>',
              headers={'Authorization': 'Bearer YOUR_TOKEN'}
          )
          print(r.json())
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/organizations/<organization_id>/auth-providers/<auth_provider_id>/identities/<user_id>', {
            headers: { 'Authorization': 'Bearer YOUR_TOKEN' },
          });
          const data = await response.json();
  /organizations/{organization_id}/auth-providers:
    get:
      tags:
      - IdP Mappings
      summary: List Auth Providers
      description: |-
        List the organization's identity providers, to find the ``auth_provider_id`` that the IdP
        mapping routes take.

        A personal access token must belong to an organization admin, be minted for this organization
        (``{organization_id}`` must match the token's organization) and be scoped to all workspaces;
        otherwise 403. Such a token gets what the same organization admin gets in a session: in a
        customer-VPC deployment every field of a native SAML provider (one with a SAML config) and the
        reduced ``OrgAdminAuthProviderSchema`` (no verified domains or default-provider flag) for the
        others; elsewhere the reduced schema for all. Zenlytic staff sessions get every field; anyone
        else 404.
      operationId: list_auth_providers_organizations__organization_id__auth_providers_get
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2CollectionResponse_Union_AuthProviderSchema__OrgAdminAuthProviderSchema__'
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2ErrorResponse'
          description: Server Error
      x-codeSamples:
      - lang: cURL
        source: |
          curl -L https://api-external.zenlytic.com/api/v2/organizations/<organization_id>/auth-providers \
            -H 'Authorization: Bearer YOUR_TOKEN'
      - lang: Python
        source: |
          import requests
          r = requests.get(
              'https://api-external.zenlytic.com/api/v2/organizations/<organization_id>/auth-providers',
              headers={'Authorization': 'Bearer YOUR_TOKEN'}
          )
          print(r.json())
      - lang: JavaScript
        source: |
          const response = await fetch('https://api-external.zenlytic.com/api/v2/organizations/<organization_id>/auth-providers', {
            headers: { 'Authorization': 'Bearer YOUR_TOKEN' },
          });
          const data = await response.json();
