    CreateGroupMappingSchema:
      properties:
        idp_group_name:
          type: string
          title: Idp Group Name
          description: Group name exactly as the identity provider sends it.
        group_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Id
          description: An existing organization group of this organization. Give this or group_name.
        group_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Name
          description: Name of a new organization group to create for this mapping, in the same request.
            Give this or group_id. Creating a group through a mapping is not blocked by the manual group
            creation setting; 409 if the organization already has a group with this name.
