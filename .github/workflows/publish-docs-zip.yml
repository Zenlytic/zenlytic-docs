name: Publish docs zip
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.cursor/**'
      - 'docs/.gitbook/**'
      - 'docs/.gitbook.yaml'
      - '.gitignore'
      - '.nvmrc'
      - 'book.json'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/legacy/**'

jobs:
  zip-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build docs.zip
        # Zipped from inside docs/ so archive-internal paths stay identical to
        # before the restructure (e.g. ./core-concepts/foo.md), keeping any
        # downstream consumer of docs.zip working unchanged. Repo tooling
        # (.github, .cursor, book.json, package*.json) now sits outside docs/
        # and no longer needs excluding.
        run: |
          cd docs
          zip -r ../docs.zip . \
            -x '.gitbook/*' \
            -x '.gitbook.yaml' \
            -x 'legacy/*'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: docs-latest
          files: docs.zip
