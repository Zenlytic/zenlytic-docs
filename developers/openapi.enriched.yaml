          title: Id
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
        organization_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Id
        provider_type:
          type: string
          title: Provider Type
        provider_name:
          type: string
          title: Provider Name
        subdomain:
          type: string
          title: Subdomain
        include_default_provider:
          type: boolean
          title: Include Default Provider
        verified_email_domains:
          items:
            type: string
          type: array
          title: Verified Email Domains
        groups_claim:
          anyOf:
          - type: string
          - type: 'null'
          title: Groups Claim
          description: OIDC claim carrying the user's IdP group names. Null means "groups". The groups
            sync runs at sign-in when this is set or the provider maps any IdP group.
        button_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Button Label
          description: Login button text, shown as "Continue With <label>". Null means the login page's
            default for the provider type.
